services:
  - type: web
    runtime: static
    name: qihuang-zhijing
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_API_BASE_URL
        value: https://qihuang-api.onrender.com
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
  - type: web
    runtime: node
    name: qihuang-api
    branch: main
    plan: free
    region: singapore
    buildCommand: npm ci --prefix server --include=dev && npm --prefix server run check
    startCommand: npm --prefix server start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://qihuang-zhijing.onrender.com
      # Register the owner first; then set the existing username in the API dashboard.
      - key: INITIAL_ADMIN_USERNAME
        value: ""
      - key: AI_CONFIG_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: qihuang-study
          property: connectionString
databases:
  - name: qihuang-study
    plan: free
    region: singapore
    postgresMajorVersion: "16"
